spring.application.name=fittrack-core
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fittrack}
spring.datasource.username=${POSTGRES_USER:fittrack}
spring.datasource.password=${POSTGRES_PASSWORD:fittrack_dev_only}
spring.jpa.hibernate.ddl-auto=validate
fittrack.external-api.base-url=${EXTERNAL_API_BASE_URL:http://localhost:8081}
fittrack.external-api.api-key=${EXTERNAL_API_KEY:local-mock-key}
fittrack.external-api.connect-timeout=2s
fittrack.external-api.read-timeout=3s

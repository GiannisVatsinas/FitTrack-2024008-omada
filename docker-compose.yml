services:
  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fittrack}
      POSTGRES_USER: ${POSTGRES_USER:-fittrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fittrack_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  external-mock:
    build:
      context: ./external-mock-service
    environment:
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-local-mock-key}
    ports:
      - "8081:8081"

  app:
    build:
      context: ./fittrack-core
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-fittrack}
      POSTGRES_USER: ${POSTGRES_USER:-fittrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fittrack_dev_only}
      EXTERNAL_API_BASE_URL: http://external-mock:8081
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-local-mock-key}
    depends_on:
      postgres-db:
        condition: service_healthy
      external-mock:
        condition: service_started

volumes:
  postgres-data:

networks:
  default:
    name: fittrack-net
